# Required: set a long random value in the environment.
proxy.api-key=${PROXY_API_KEY:}
# Strongly recommended: comma-separated destination hostnames.
proxy.allowed-hosts=${PROXY_ALLOWED_HOSTS:}

server.tomcat.max-swallow-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# RestClient uses the underlying JDK HTTP client; keep responses bounded by the app's request limits.
server.tomcat.connection-timeout=10s
