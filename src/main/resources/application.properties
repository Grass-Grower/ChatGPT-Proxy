# Required: set a long random value in the environment.
proxy.api-key=${PROXY_API_KEY:}
# Comma-separated hostnames. Example: example.com,api.example.org
# Leave empty only when the proxy is protected and otherwise trusted.
proxy.allowed-hosts=${PROXY_ALLOWED_HOSTS:}

server.tomcat.max-swallow-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
